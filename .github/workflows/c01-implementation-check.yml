name: C01 implementation checks
on:
  push:
    branches: [feature/c01-resolution-eligibility]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: C01 contract tests
        run: node --test tests/c01-resolution-eligibility.test.js tests/c01-resolution-historical.test.js tests/c01-resolution-offline.test.js
      - name: Maven tests
        run: node --test tests/identity-maven.test.js
      - name: Complete suite
        run: node --test tests/*.test.js
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
