name: C01 Spring independent project snapshot
on:
  push:
    branches: [feature/c01-spring-framework-pilot]
    paths:
      - '.github/workflows/c01-spring-project-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c01-spring-framework-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allocate independent Spring Framework identity offline
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {createProjectIdentityRegistry,allocateProjectIdentity,validateProjectIdentitySnapshot}=require('./js/project-identity.js');
          const {canonicalJSON}=require('./js/enrichment-canonical.js');
          const folder='fixtures/c01/spring';
          const target=folder+'/spring-framework-project-identity.snapshot.json';
          const readme=fs.readFileSync(folder+'/spring-framework-v6.1.3-readme.md');
          if(!readme.toString('utf8').includes('This is the home of the Spring Framework'))throw Error('INDEPENDENT_SOURCE_MISSING');
          if(fs.existsSync(target)){validateProjectIdentitySnapshot(JSON.parse(fs.readFileSync(target,'utf8')));console.log('Existing verified snapshot retained');process.exit(0)}
          const sha=crypto.createHash('sha256').update(readme).digest('hex');
          const snapshot=allocateProjectIdentity(createProjectIdentityRegistry(),{
            projectId:'project:'+crypto.randomBytes(32).toString('hex'),
            attributionId:'attribution:'+crypto.randomBytes(32).toString('hex'),
            createdAt:new Date().toISOString(),
            attributionContext:{scope:'independent-project-identity-only',projectSourceSha256:sha,officialSource:'spring-projects/spring-framework@v6.1.3:README.md'},
            name:'Spring Framework',
            url:'https://spring.io/projects/spring-framework'
          });
          validateProjectIdentitySnapshot(snapshot);
          if(snapshot.links.length!==0)throw Error('PACKAGE_LINK_NOT_ALLOWED_AT_ALLOCATION');
          fs.writeFileSync(target,canonicalJSON(snapshot)+'\n');
          console.log('Spring ProjectIdentity:',snapshot.projects[0].id,'snapshotDigest:',snapshot.snapshotDigest);
          NODE
      - name: Commit verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/c01/spring/spring-framework-project-identity.snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(c01): allocate independent Spring Framework ProjectIdentity'
            git push origin HEAD:feature/c01-spring-framework-pilot
          fi
