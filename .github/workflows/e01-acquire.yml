name: E01 official Apache governance acquisition
on:
  push:
    branches: [feature/e01-governance]
    paths: [.github/workflows/e01-acquire.yml]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/e01-governance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and archive official Apache pages
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const urls={
            'apache-logging-guidelines':'https://logging.apache.org/guidelines.html',
            'apache-log4j-guidelines':'https://logging.apache.org/log4j/2.3.x/guidelines.html',
            'apache-logging-charter':'https://logging.apache.org/charter.html'
          };
          (async()=>{
            fs.mkdirSync('fixtures/e01/apache',{recursive:true});
            for(const [key,url] of Object.entries(urls)){
              const r=await fetch(url,{redirect:'follow'});
              if(r.status!==200)throw Error(key+' HTTP '+r.status);
              const bytes=Buffer.from(await r.arrayBuffer());
              const hash=crypto.createHash('sha256').update(bytes).digest('hex');
              const archiveId='archive:'+hash;
              fs.writeFileSync('fixtures/e01/apache/'+key+'.html',bytes);
              fs.writeFileSync('fixtures/e01/apache/'+key+'.observation.json',JSON.stringify({url,finalUrl:r.url,status:r.status,observedAt:new Date().toISOString(),contentType:r.headers.get('content-type'),sha256:hash,archiveId,provider:'apache-official-http',rawPath:'fixtures/e01/apache/'+key+'.html'},null,2)+'\n');
              console.log(key,bytes.length,hash,archiveId);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit archived evidence to existing branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/e01/apache
          git diff --cached --quiet || (git commit -m 'evidence(e01): archive official Apache governance pages with SHA-256' && git push origin HEAD:feature/e01-governance)
