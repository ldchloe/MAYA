name: C01 Spring official Maven acquisition
on:
  push:
    branches: [feature/c01-spring-framework-pilot]
    paths:
      - '.github/workflows/c01-spring-acquire.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c01-spring-framework-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire and archive Maven Central with Lot B provider
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const {createMavenCentralProvider}=require('./js/identity-maven-provider.js');
          const {createObservationArchive,createMemoryBackend}=require('./js/identity-archive.js');
          (async()=>{
            const id={ecosystem:'maven',namespace:'org.springframework',name:'spring-core',version:'6.1.3'};
            const provider=createMavenCentralProvider({fetchImpl:fetch,now:()=>new Date().toISOString()});
            const acquisition=await provider.acquire(id);
            if(acquisition.status!==200||acquisition.transport!=='ok')throw Error('MAVEN_ACQUISITION_FAILED '+JSON.stringify({status:acquisition.status,transport:acquisition.transport}));
            const body=Buffer.from(acquisition.body,'utf8');
            if(!/<artifactId>spring-core<\/artifactId>/.test(acquisition.body)||!/<version>6\.1\.3<\/version>/.test(acquisition.body))throw Error('MAVEN_POM_COORDINATE_INVALID');
            const archive=createObservationArchive(createMemoryBackend());
            const ref=await archive.store(acquisition);
            const folder='fixtures/c01/spring/maven-central';
            fs.mkdirSync(folder,{recursive:true});
            fs.writeFileSync(folder+'/spring-core-6.1.3.pom',body);
            fs.writeFileSync(folder+'/spring-core-6.1.3.observation.json',JSON.stringify({acquisition,reference:ref,bodySha256:crypto.createHash('sha256').update(body).digest('hex'),contentType:'application/xml',acquisitionMethod:'Lot B createMavenCentralProvider',archivedAt:new Date().toISOString()},null,2)+'\n');
            console.log('V-P archive stored:',ref.id);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit acquisition archive to existing Spring branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/c01/spring/maven-central
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(c01): archive real spring-core 6.1.3 Maven Central observation'
            git push origin HEAD:feature/c01-spring-framework-pilot
          fi
