name: G01 temporary official event acquisition
on:
  push:
    paths:
      - '.github/workflows/g01-acquire.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/g01-trust-events
      - name: Acquire official JUnit release event records
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,datetime,pathlib
          root=pathlib.Path('fixtures/g01/junit');root.mkdir(parents=True,exist_ok=True)
          for tag in ['r4.13.1','r4.13.2']:
            url='https://api.github.com/repos/junit-team/junit4/releases/tags/'+tag
            req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'MAYA-G01-official-acquisition','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.urlopen(req,timeout=45) as res:
              body=res.read();meta={'requestedUrl':url,'finalUrl':res.url,'httpStatus':res.status,'contentType':res.headers.get('Content-Type'),'acquiredAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'sizeBytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
            record=json.loads(body)
            if meta['httpStatus']!=200 or record.get('tag_name')!=tag or not record.get('published_at') or record.get('draft') or record.get('prerelease'):raise ValueError('INVALID_OFFICIAL_RELEASE')
            meta['archiveId']='archive:'+meta['sha256']
            (root/(tag+'.json')).write_bytes(body)
            (root/(tag+'.metadata.json')).write_text(json.dumps(meta,indent=2)+'\n')
            print(tag,meta)
          PY
      - name: Commit archived raw bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/g01
          git commit -m 'evidence(g01): archive two official JUnit historical releases'
          git push origin HEAD:feature/g01-trust-events
