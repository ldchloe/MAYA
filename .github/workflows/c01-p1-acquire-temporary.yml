name: Temporary C01 P1 official acquisition
on:
  push:
    branches: [feature/c01-package-project-evidence]
    paths: ['.github/workflows/c01-p1-acquire-temporary.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c01-package-project-evidence
          persist-credentials: true
      - name: Fetch raw official HTML and HTTP metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixtures/c01/official-p1
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 --dump-header fixtures/c01/official-p1/headers.txt --output fixtures/c01/official-p1/dependency-info.html --write-out '%{http_code}\n%{url_effective}\n%{content_type}\n' 'https://junit.org/junit4/dependency-info.html' > fixtures/c01/official-p1/transport.txt
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib
          root=pathlib.Path('fixtures/c01/official-p1')
          raw=(root/'dependency-info.html').read_bytes()
          lines=(root/'transport.txt').read_text().splitlines()
          digest=hashlib.sha256(raw).hexdigest()
          metadata={'archiveFormat':'c01-official-http-archive-v1','sourceUrl':'https://junit.org/junit4/dependency-info.html','finalUrl':lines[1],'httpStatus':int(lines[0]),'contentType':lines[2],'acquiredAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'provider':'github-actions-curl','method':'GET','bodySha256':digest,'bodyBytes':len(raw),'archiveId':'sha256:'+digest,'bodyPath':'fixtures/c01/official-p1/dependency-info.html','headersPath':'fixtures/c01/official-p1/headers.txt'}
          (root/'acquisition.json').write_text(json.dumps(metadata,sort_keys=True,indent=2)+'\n')
          assert metadata['httpStatus']==200
          print('P1 archive sha256:',digest)
          PY
      - name: Commit exact archive to existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixtures/c01/official-p1/
          git commit -m 'archive(c01): acquire official JUnit Maven documentation P1 over HTTP'
          git push origin HEAD:feature/c01-package-project-evidence
